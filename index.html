<style>
:root{
  --paper:#f5efe1;--paper2:#ece3cf;--card:#fbf7ee;--ink:#2a2520;--ink2:#4a4339;--muted:#7b7163;--line:#dcd1ba;--line2:#c9bb9d;
  --jok:#2d4a7c;--jok2:#3d5f99;--jokbg:#e6ebf3;--jokbg2:#d3dcea;--good:#3f6b4a;--warn:#8a5a2b;--bad:#7a3b3b;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;--sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--brush:'Yeon Sung','Nanum Brush Script',cursive;
  --fs:17px;
}
html.dark{--paper:#1c1a17;--paper2:#25221d;--card:#24211c;--ink:#ece4d2;--ink2:#d6ccb7;--muted:#a49a88;--line:#3a352d;--line2:#4a4339;--jok:#9fb6e0;--jok2:#b8cbee;--jokbg:#26303f;--jokbg2:#2e3a4e;--good:#9cc5a6;--warn:#d8b07e;--bad:#d89a9a;}
html.fs0{--fs:15px}html.fs1{--fs:17px}html.fs2{--fs:19.5px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
#app{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.7;
  background-image:radial-gradient(rgba(120,100,60,.05) 1px,transparent 1.2px),radial-gradient(rgba(120,100,60,.04) 1px,transparent 1.2px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
html.dark body{background-image:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--jok)}
.hide{display:none!important}
.brush{font-family:var(--brush);font-weight:400}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:.55em 1.1em;font-size:.95em;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--jok);background:var(--jokbg)}
.btn.pri{background:var(--jok);border-color:var(--jok);color:#fff;font-weight:700}
html.dark .btn.pri{color:#14171c}
.btn.pri:hover{background:var(--jok2)}
.btn.sm{padding:.3em .7em;font-size:.82em;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--jokbg);border-color:var(--line)}
.btn.on{background:var(--jokbg2);border-color:var(--jok);color:var(--jok);font-weight:700}
.opt .meta .chip{white-space:normal;text-align:left}
.chip{display:inline-block;padding:.05em .55em;border-radius:999px;border:1px solid var(--line2);font-size:.78em;color:var(--ink2);background:var(--card);margin:.1em .15em .1em 0;white-space:nowrap}
.chip.j{border-color:var(--jok);color:var(--jok);background:var(--jokbg)}
.chip.w{border-color:var(--warn);color:var(--warn)}
.chip.b{border-color:var(--bad);color:var(--bad)}
.term{border-bottom:1px dotted var(--jok);cursor:help;color:inherit}
.term:hover{background:var(--jokbg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.frame{border:1px solid var(--line2);outline:1px solid var(--line);outline-offset:4px}

/* ---- 시작 화면 ---- */
#scr-title{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px}
.topmini{width:100%;max-width:880px;display:flex;justify-content:flex-end;gap:6px}
.hero{text-align:center;margin-top:5vh}
.hero .eyebrow{font-family:var(--serif);letter-spacing:.35em;color:var(--muted);font-size:.85em}
.hero h1{font-family:var(--brush);font-size:clamp(56px,9vw,100px);line-height:1;margin:.15em 0 .05em;color:var(--ink);font-weight:400}
.hero .seal{display:inline-block;border:2px solid var(--jok);color:var(--jok);font-family:var(--serif);font-weight:700;padding:.15em .4em;border-radius:6px;font-size:.8em;transform:rotate(-4deg);margin-left:.3em;vertical-align:middle}
.hero .sub{font-family:var(--serif);font-size:1.1em;color:var(--ink2)}
.intro{max-width:560px;text-align:center;font-family:var(--serif);color:var(--ink2);margin:26px auto 8px}
.intro p{margin:.35em 0}
.startbox{display:flex;flex-direction:column;gap:10px;align-items:center;margin:22px 0 10px;width:100%;max-width:420px}
.startbox .btn{width:100%;padding:.85em 1em;font-size:1.05em}
.startbox .resume small{display:block;font-weight:400;font-size:.8em;opacity:.85}
.pastmini{width:100%;max-width:560px;margin-top:22px}
.pastmini h3{font-family:var(--serif);font-size:.95em;color:var(--muted);font-weight:600;margin:0 0 6px;text-align:center;letter-spacing:.1em}
.pastrow{display:flex;justify-content:space-between;gap:10px;padding:.55em .9em;border-bottom:1px dashed var(--line);font-family:var(--serif);font-size:.92em;cursor:pointer;border-radius:8px}
.pastrow:hover{background:var(--jokbg)}
.pastrow .ep{color:var(--jok);font-size:.88em}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-top:28px;font-size:.92em}
.links button,.links a{background:none;border:none;color:var(--jok);padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit}
.foot{margin-top:18px;text-align:center;color:var(--muted);font-size:.8em;max-width:620px}
.foot.credit{margin-top:10px;font-size:.85em;color:var(--ink2)}
.banner{width:100%;max-width:880px;background:var(--jokbg);border:1px solid var(--jok);border-radius:10px;padding:.6em 1em;font-size:.88em;margin-bottom:10px}
.cloudnote{font-size:.8em;color:var(--good);margin-top:6px;text-align:center}

/* ---- 출생 ---- */
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 16px}
.scroll{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:34px 38px;position:relative;box-shadow:0 12px 40px rgba(60,40,10,.08)}
.scroll:before,.scroll:after{content:'';position:absolute;left:-10px;right:-10px;height:14px;background:var(--paper2);border:1px solid var(--line2);border-radius:7px}
.scroll:before{top:-8px}.scroll:after{bottom:-8px}
.scroll h2{font-family:var(--brush);font-weight:400;font-size:52px;text-align:center;margin:0 0 14px;line-height:1}
.rollrow{display:flex;gap:14px;padding:.5em 0;border-bottom:1px dashed var(--line);font-family:var(--serif)}
.rollrow .k{width:6.2em;color:var(--muted);flex:none}
.rollrow .v{flex:1;font-weight:600}
.rollrow .v.spin{color:var(--muted);font-weight:400;filter:blur(.4px)}
.anc{margin-top:12px;padding:.6em .9em;background:var(--jokbg);border-radius:8px;font-family:var(--serif);font-size:.92em;color:var(--jok)}
.lenpick{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:16px;font-size:.88em;flex-wrap:wrap}
.rowbtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.namecard{background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:16px 12px;text-align:center;cursor:pointer;font-family:var(--serif)}
.namecard:hover{border-color:var(--jok);background:var(--jokbg)}
.namecard b{display:block;font-size:1.5em;margin-bottom:4px}
.namecard span{font-size:.82em;color:var(--muted)}

/* ---- 플레이 ---- */
#scr-play{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line2);background:var(--paper);position:relative;z-index:5}
#top .brand{font-family:var(--brush);font-size:30px;line-height:1;cursor:pointer;white-space:nowrap}
#top .era{flex:1;min-width:0;text-align:center;font-family:var(--serif)}
#top .era b{font-size:1.08em}
#top .era .sm{color:var(--muted);font-size:.85em;margin-left:.4em}
#top .ctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--jok);width:0;transition:width .25s linear}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) 350px;grid-template-rows:minmax(0,1fr);overflow:hidden}
#grid>*{min-height:0}
#me,#side{overflow:auto;padding:16px}
#me{border-right:1px solid var(--line)}
#side{border-left:1px solid var(--line)}
#mid{position:relative;min-height:0;display:flex;flex-direction:column}
#feedtools{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:8px 18px;border-bottom:1px dashed var(--line);font-size:.85em;color:var(--muted)}
#feed{flex:1;overflow:auto;padding:10px 22px 40px;font-family:var(--serif)}
.who{padding:2px 2px 12px;border-bottom:1px dashed var(--line);margin-bottom:12px}
.who .nm{font-family:var(--serif);font-size:1.35em;font-weight:700}
.who .st{color:var(--ink2);font-size:.9em}
.who .meta{font-size:.84em;color:var(--muted);margin-top:4px}
.kv{display:flex;justify-content:space-between;font-size:.88em;padding:.15em 0}
.kv span:first-child{color:var(--muted)}
.sec{margin:16px 0 6px;font-size:.8em;letter-spacing:.12em;color:var(--muted);font-weight:700}
.bar{display:grid;grid-template-columns:3.2em 1fr 2.2em;gap:8px;align-items:center;font-size:.84em;margin:3px 0}
.bar .t{height:7px;background:var(--paper2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--jok);border-radius:5px}
.bar.w .t i{background:var(--warn)}
.bar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.foci{display:flex;flex-wrap:wrap;gap:5px}
.foci .btn{padding:.28em .7em;font-size:.82em;border-radius:999px}
.foci .btn[disabled]{opacity:.45;cursor:default}
.fnote{font-size:.8em;color:var(--muted);margin-top:6px}
.stathelp{margin-top:6px;font-size:.8em;line-height:1.55;color:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:.5em .7em;background:var(--card)}
.stathelp div{margin:.3em 0}
.stathelp b{color:var(--jok);margin-right:.3em}
.focusdesc{margin-top:8px;padding:.5em .7em;border:1px solid var(--jok);background:var(--jokbg);border-radius:10px;font-size:.84em;line-height:1.55}
.focusdesc b{color:var(--jok)}

.stage{margin-top:14px}
.stage>.sh{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-family:var(--sans);font-size:.8em;letter-spacing:.14em;font-weight:700;padding:4px 0;user-select:none}
.stage>.sh:after{content:'';flex:1;border-bottom:1px solid var(--line)}
.yr{margin:2px 0;border-radius:10px}
.yr>.yh{display:flex;gap:10px;align-items:baseline;cursor:pointer;padding:6px 8px;border-radius:8px;user-select:none}
.yr>.yh:hover{background:var(--jokbg)}
.yr>.yh .lab{font-weight:700;white-space:nowrap}
.yr>.yh .gz{color:var(--muted);font-size:.82em;white-space:nowrap}
.yr>.yh .sum{flex:1;min-width:0;color:var(--ink2);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yr>.yh .dot{width:7px;height:7px;border-radius:50%;background:var(--jok);flex:none;align-self:center}
.yr>.yh .tg{font-size:.75em;color:var(--muted)}
.yr .yb{padding:0 8px 8px 22px;border-left:2px solid var(--line);margin-left:11px}
.yr.cur>.yh{background:var(--jokbg)}
.ln{margin:.28em 0}
.ln.big{font-weight:600}
.ln.news{border:1px solid var(--jok);background:var(--jokbg);color:var(--jok);border-radius:8px;padding:.35em .7em;font-size:.93em}
.ln.news:before{content:'나라의 소식 · ';font-family:var(--sans);font-weight:700;font-size:.8em}
.ln.alt{border:1px dashed var(--jok);border-radius:8px;padding:.35em .7em;font-size:.93em}
.ln.alt:before{content:'이 판의 역사 · ';font-family:var(--sans);font-weight:700;font-size:.8em;color:var(--jok)}
.ln.warn{color:var(--warn);font-style:italic}
.ln.warn:before{content:'갈림길의 기운 · ';font-style:normal;font-family:var(--sans);font-weight:700;font-size:.8em}
.ln.chg{font-family:var(--sans);font-size:.78em;color:var(--muted)}
.ln.pick{font-family:var(--sans);font-size:.85em;color:var(--jok);font-weight:700}
.ln.note{font-family:var(--sans)}
.note{border:1px solid var(--line2);background:var(--paper2);border-radius:8px;font-size:.88em}
.note summary{cursor:pointer;padding:.35em .7em;color:var(--ink2);font-weight:700;list-style:none}
.note summary:before{content:'📜 역사 노트 · ';font-weight:400;color:var(--muted)}
.note div{padding:0 .8em .6em;font-family:var(--serif);color:var(--ink2)}
.awaycard{margin:10px 0;padding:12px 14px;border:1px solid var(--jok);background:var(--jokbg);border-radius:12px;font-size:.92em}
.awaycard b{color:var(--jok)}
.awaycard ul{margin:.4em 0 .5em;padding-left:1.2em}

#scene{position:absolute;inset:0;background:rgba(40,30,15,.28);display:flex;align-items:flex-end;justify-content:center;padding:18px;z-index:4}
html.dark #scene{background:rgba(0,0,0,.45)}
#scene .sc{width:100%;max-width:720px;max-height:calc(100% - 10px);overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:20px 22px;box-shadow:0 20px 60px rgba(40,20,0,.22);font-family:var(--serif)}
#scene .stop{font-family:var(--sans);font-size:.75em;letter-spacing:.2em;color:var(--jok);font-weight:700}
#scene h3{margin:.15em 0 .3em;font-size:1.35em}
#scene .tx{color:var(--ink2);margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:.7em .95em;margin:7px 0;font-family:var(--serif)}
.opt:hover:not([disabled]){border-color:var(--jok);background:var(--jokbg)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt .ot{font-weight:700}
.opt .os{font-size:.85em;color:var(--muted);font-family:var(--sans)}
.opt .meta{margin-top:5px;font-family:var(--sans)}
.odds{font-size:.75em;font-weight:700;font-family:var(--sans);padding:.05em .55em;border-radius:6px;background:var(--jokbg2);color:var(--jok);margin-left:.4em;white-space:nowrap}
.odds.u{background:var(--paper2);color:var(--muted)}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:8px 0}
.cand{border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--paper);font-size:.9em}
.cand b{font-size:1.05em}
.cand .gh{margin-top:6px;font-size:.88em;color:var(--jok)}
.fate{margin-top:8px;text-align:center}

.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs .btn{flex:1;padding:.4em .2em;font-size:.86em}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.pc{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.pc:hover{border-color:var(--line2)}
.pc.off{opacity:.55}
.pc .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc .h b{font-family:var(--serif)}
.pc .m{font-size:.8em;color:var(--muted)}
.hb{display:grid;grid-template-columns:4.2em 1fr 4.6em;gap:6px;align-items:center;font-size:.78em;margin-top:4px}
.hb .t{height:6px;border-radius:4px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--jok)}
.hb.r .t i{background:var(--bad)}
.hb .blur{filter:blur(2.5px)}
.seek{border:1px dashed var(--jok);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:var(--card)}
.pc .info{font-size:.8em;color:var(--ink2);margin-top:2px}
.pc.tgt{border-color:var(--jok);box-shadow:0 0 0 1px var(--jok) inset}
.pc .more{margin-top:6px;font-size:.84em;color:var(--ink2);font-family:var(--serif);border-top:1px dashed var(--line);padding-top:6px}
.tree{font-family:var(--serif);font-size:.9em}
.lifelog{max-width:720px;margin:18px auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.lifelog>summary{cursor:pointer;font-weight:600;color:var(--jok);padding:6px 0}
.lifelog .ll-tools{margin:4px 0 8px;text-align:right}
.lifelog .ll-y{border-top:1px dashed var(--line);padding:6px 0}
.lifelog .ll-y>summary{cursor:pointer;font-size:.95em}
.lifelog .ll-y p{margin:4px 0 4px 12px;font-size:.92em;line-height:1.7}
.lifelog .ll-y p.big{font-weight:600}
.fam .fg{margin:0 0 14px}
.fam .fgh{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--sans);font-size:.78em;color:var(--jok);font-weight:700;letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.fam .fgh span{color:var(--muted);font-weight:400;letter-spacing:0}
.fam .fm{display:grid;grid-template-columns:minmax(4.5em,auto) 1fr;column-gap:10px;padding:6px 8px;border-radius:8px;align-items:baseline}
.fam .fm:nth-child(odd){background:rgba(0,0,0,.025)}
.fam .fn{font-weight:600}
.fam .fr{color:var(--ink2);font-size:.92em;text-align:right}
.fam .fx{grid-column:1/-1;color:var(--muted);font-size:.8em;margin-top:1px}
.fam .kst{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78em;color:var(--muted);margin-top:3px}
.fam .kst b{color:var(--ink);font-weight:600}
.fam .kedu{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:.8em;margin-top:4px}
.fam .kedu select{font:inherit;padding:2px 4px;border:1px solid var(--line2);border-radius:6px;background:var(--card);color:var(--ink)}
.fam .fm.me{background:var(--jokbg);}
.fam .fm.me .fn{color:var(--jok)}
.fam .fm.dead{opacity:.5}
.tree .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0;position:relative}
.tree .lv{font-size:.72em;color:var(--muted);text-align:center;letter-spacing:.15em;margin-top:10px;font-family:var(--sans)}
.tree .nd{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:.3em .6em;text-align:center;min-width:4.5em;line-height:1.35}
.tree .nd small{display:block;color:var(--muted);font-size:.78em}
.tree .nd.me{border-color:var(--jok);background:var(--jokbg);font-weight:700}
.tree .nd.dead{opacity:.55}
.tree .vline{width:1px;height:12px;background:var(--line2);margin:0 auto}
.tl{font-size:.86em}
.tl .k{font-family:var(--sans);font-size:.75em;font-weight:700;color:var(--jok);margin:12px 0 4px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.tl .r{display:grid;grid-template-columns:3.2em 1fr 1fr;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line)}
.tl .r .y{color:var(--muted);font-variant-numeric:tabular-nums}
.tl .r .na{color:var(--jok)}
.tl .r.alt{background:var(--jokbg)}
.lt{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;cursor:pointer;background:var(--card);font-family:var(--serif)}
.lt:hover{border-color:var(--jok)}
.lt .m{font-family:var(--sans);font-size:.76em;color:var(--muted)}

/* ---- 모달 ---- */
.modal{position:fixed;inset:0;background:rgba(30,20,10,.38);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal .box{background:var(--card);border:1px solid var(--line2);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px}
.modal h3{margin:0 0 10px;font-family:var(--serif)}
.letter{background:#f8f1df;color:#2b241b;border:1px solid #d9c9a6;border-radius:4px;padding:26px 28px;font-family:var(--serif);white-space:pre-line;line-height:2;box-shadow:inset 0 0 40px rgba(170,140,80,.15)}
.pop{position:fixed;z-index:60;max-width:300px;background:var(--card);border:1px solid var(--jok);border-radius:10px;padding:.6em .8em;font-size:.86em;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.pop b{color:var(--jok)}
.guide ol{padding-left:1.2em;font-family:var(--serif)}
.guide li{margin:.5em 0}

/* ---- 실록 ---- */
#scr-end{min-height:100%;padding:30px 16px 60px;display:flex;flex-direction:column;align-items:center}
.sillok{width:100%;max-width:720px;background:#f8f1df;color:#2b241b;border:1px solid #d6c49e;padding:44px 52px;position:relative;box-shadow:0 14px 50px rgba(60,40,10,.12)}
html.dark .sillok{background:#2a261f;color:#ece4d2;border-color:#4a4339}
.sillok:before{content:'';position:absolute;inset:10px;border:1px solid rgba(45,74,124,.35);pointer-events:none}
.sillok h2{font-family:var(--brush);font-weight:400;font-size:58px;text-align:center;margin:0;line-height:1.1}
.sillok .ep{text-align:center;color:var(--jok);font-family:var(--serif);font-weight:700;margin-top:6px}
.sillok .mt{text-align:center;font-size:.86em;color:var(--muted);margin:4px 0 22px}
.sillok .s{margin:16px 0}
.sillok .s h4{margin:0 0 4px;font-family:var(--sans);font-size:.8em;letter-spacing:.2em;color:var(--jok)}
.sillok .s p{margin:0;font-family:var(--serif);line-height:1.95}
.sillok .s.alt{border:1px dashed var(--jok);padding:10px 14px;border-radius:6px}
.sillok .s.v p{font-weight:600}
.sillok .lttr{margin:18px 0;padding:14px 18px;border-left:3px solid var(--jok);white-space:pre-line;font-family:var(--serif);font-size:.95em;background:rgba(45,74,124,.05)}
.sillok .stamp{position:absolute;right:46px;top:40px;border:2px solid var(--jok);color:var(--jok);font-family:var(--serif);font-weight:700;padding:.2em .35em;transform:rotate(8deg);border-radius:6px;font-size:.85em;opacity:.85}
.newcodex{max-width:720px;width:100%;margin-top:16px;font-size:.9em;text-align:center}
.page{max-width:820px;margin:0 auto;padding:26px 18px 60px}
.page h3.gh{font-family:var(--sans);font-size:.95em;color:var(--jok);margin:22px 0 6px;letter-spacing:.05em}
.page h2{font-family:var(--brush);font-weight:400;font-size:52px;margin:0 0 4px}
.page .back{margin-bottom:10px}
.cxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cx{border:1px solid var(--line);border-radius:10px;padding:.55em .6em;text-align:center;font-family:var(--serif);font-size:.9em;background:var(--card)}
.cx.off{color:var(--muted);background:transparent;border-style:dashed}
.cx.clk{cursor:pointer}
.pct{font-size:.85em;color:var(--muted);margin:2px 0 12px}
textarea{width:100%;min-height:110px;font-family:ui-monospace,monospace;font-size:.78em;background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.55em 1.1em;border-radius:10px;font-size:.9em;z-index:70}
#mnav{display:none}

@media (max-width:1100px){#grid{grid-template-columns:250px minmax(0,1fr) 300px}}
@media (max-width:900px){
  #grid{grid-template-columns:minmax(0,1fr)}
  #me,#side{border:none}
  #grid>*{display:none}
  #grid>.show{display:flex}
  #me.show,#side.show{display:block}
  #mnav{display:flex;border-top:1px solid var(--line2);background:var(--paper)}
  #mnav button{flex:1;border:none;background:none;padding:.65em 0;font-size:.82em;color:var(--muted)}
  #mnav button.on{color:var(--jok);font-weight:700}
  #top{flex-wrap:wrap;gap:6px;padding:6px 10px}
  #top .brand{font-size:24px}
  #top .era{order:3;flex-basis:100%;font-size:.9em}
  .names{grid-template-columns:1fr}
  .sillok{padding:30px 22px}
  .sillok .stamp{display:none}
  #feed{padding:8px 12px 30px}
}
.deathnext{margin:18px 4px 8px;padding:14px;border:1px solid var(--line,#ccc);border-radius:10px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
</style>
